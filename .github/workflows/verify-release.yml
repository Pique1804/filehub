name: Verify release candidate (manual)

# Source pushes and pull requests never start builds. An operator explicitly
# dispatches this workflow only after authorizing verification of a concrete SHA.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 1GiB
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Installer and backup tests (synthetic fixtures only)
        run: |
          python3 -m unittest discover -s server/distribution/prebuilt -p 'test_*.py'
          python3 -m unittest discover -s server/host-storage -p 'test_*.py'
          python3 -m unittest discover -s server/scripts -p 'test_*.py'
      - name: Frontend, Go tests, vet and static binary
        run: bash server/scripts/build-release.sh "$GITHUB_WORKSPACE/release-candidate/server"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-${{ github.sha }}
          path: release-candidate/server/
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dkotlin.daemon.jvm.options=-Xmx1024m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.7'
      - name: Unit tests, lint and unsigned release
        working-directory: android
        run: gradle --no-daemon --max-workers=1 -PfilehubUnsigned=true :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unsigned-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/output-metadata.json
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 7
