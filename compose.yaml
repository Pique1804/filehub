services:
  filehub:
    image: filehub-local:${FILEHUB_IMAGE_TAG:-1.40.20}
    build:
      context: ./server/distribution/compose
      additional_contexts:
        installer: ./server/distribution/prebuilt
        release: ./releases
      args:
        FILEHUB_RELEASE_SHA256: ${FILEHUB_RELEASE_SHA256:?Set the SHA-256 from the FileHub release checksum}
        FILEHUB_MEDIA_TOOLS: ${FILEHUB_MEDIA_TOOLS:-0}
    platform: linux/amd64
    user: "${FILEHUB_UID:-1000}:${FILEHUB_GID:-1000}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      FILEHUB_PUBLIC_URL: "${FILEHUB_PUBLIC_URL:-http://localhost:8080}"
    ports:
      - target: 8080
        published: "${FILEHUB_PORT:-8080}"
        host_ip: "${FILEHUB_LISTEN_ADDRESS:-127.0.0.1}"
        protocol: tcp
    tmpfs:
      - /run/filehub:rw,nosuid,nodev,noexec,mode=1777,size=32m
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=128m
    volumes:
      - type: bind
        source: ${FILEHUB_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${FILEHUB_STATE_DIR:-./state}
        target: /var/lib/filehub
        bind:
          create_host_path: false
